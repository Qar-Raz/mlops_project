name: Build and push image
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image vars (example)
        env:
          IMAGE_NAME: flora-backend
          IMAGE_TAG: latest
          REGISTRY: ghcr.io            # or docker.io, or blank for local
          OWNER: ${{ github.repository_owner }}  # e.g. your-username or org
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "REGISTRY=${REGISTRY}" >> $GITHUB_ENV
          echo "OWNER=${OWNER}" >> $GITHUB_ENV

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io               # match REGISTRY
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image tag vars
        run: |
          if [ -z "${IMAGE_NAME}" ]; then echo "IMAGE_NAME empty"; exit 1; fi
          if [ -z "${IMAGE_TAG}" ]; then echo "IMAGE_TAG empty"; exit 1; fi
          # Only require OWNER if Registry requires it (e.g., ghcr)
          if [ -n "${REGISTRY}" ] && [ -z "${OWNER}" ]; then
            echo "OWNER empty while REGISTRY is set"; exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
