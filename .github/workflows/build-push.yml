name: Build and Push

on:
  workflow_dispatch:

env:
  # Azure Container Registry URL
  REGISTRY: florabotacr.azurecr.io
  # Image name (can be just the project name for ACR)
  IMAGE_NAME: flora-backend

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # Ensure you have set these secrets in your GitHub Repo settings
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # This step handles the lowercasing and tag generation automatically
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          file: ./backend/Dockerfile
          context: ./backend
          push: true
          # These outputs come from the 'meta' step above
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
